data:
  graph_dir: data/processed/deam_graphs
  max_text_len: 128
  mode: toy
  n_chroma: 12
  n_mels: 128
  sample_rate: 22050
  segment_seconds: 5
  splits_dir: data/splits_deam
  toy_dir: data/processed/toy
eval:
  top_k_retrieval:
  - 1
  - 5
  - 10
model:
  bert_hidden: 768
  bert_name: distilbert-base-uncased
  fusion_type: cross_attn
  gnn_hidden: 128
  gnn_layers: 3
  gnn_type: sage
  num_tags: 20
train:
  batch_size: 8
  contrastive_temperature: 0.07
  emotion_alpha: 0.5
  emotion_beta: 0.5
  epochs: 3
  gnn_lr: 0.001
  lr: 2.0e-05
  seed: 42
  tag_weight: 0.0
